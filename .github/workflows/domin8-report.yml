name: DOMIN8 report

# Three ways in:
#
#   repository_dispatch  the client presses a button in the Drive web app.
#                        run-report    build the report from what is in Drive
#                        fetch-uniware pull Uniware into input/uniware/ and stop
#                        Two event types, one workflow, one concurrency group —
#                        so a fetch can never run while a build is reading the
#                        same folder.
#   schedule             a forced run on the 1st and 16th, matching their
#                        twice-monthly cycle. A backstop, so a cycle still goes
#                        out if nobody remembers to press the button.
#   workflow_dispatch    you, from the Actions tab, when debugging.
#
# There is deliberately no frequent poll. Polling existed only to notice
# uploads; the button notices them the moment the client does.

on:
  repository_dispatch:
    types: [run-report, fetch-uniware]
  schedule:
    # 08:00 IST on the 1st and 16th. GitHub cron is UTC; IST is UTC+5:30.
    - cron: "30 2 1,16 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the inputs have not changed"
        type: boolean
        default: false
      no_email:
        description: "Build and publish, but send no digest"
        type: boolean
        default: false

concurrency:
  # Two runs writing to output/latest/ at once would interleave. Let the one in
  # flight finish rather than cancelling it half-published — an impatient
  # double-click must not corrupt a publish.
  group: domin8-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and publish
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          DRIVE_ROOT_ID: ${{ secrets.DRIVE_ROOT_ID }}
          ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
          ALERT_ADMINS: ${{ secrets.ALERT_ADMINS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          UNIWARE_USER: ${{ secrets.UNIWARE_USER }}
          UNIWARE_PASS: ${{ secrets.UNIWARE_PASS }}
          # client_payload is the one input here that comes from outside
          # GitHub. Interpolating it straight into the shell would be a script
          # injection; passed as env and quoted below, it is inert.
          PAYLOAD_FORCE: ${{ github.event.client_payload.force }}
          PAYLOAD_BY: ${{ github.event.client_payload.requested_by }}
          EVENT: ${{ github.event_name }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_NO_EMAIL: ${{ inputs.no_email }}
          ACTION: ${{ github.event.action }}
          PAYLOAD_DAYS: ${{ github.event.client_payload.days }}
        run: |
          set -euo pipefail

          # The fetch button is a different job entirely: it pulls Uniware into
          # Drive and stops. It must not touch the reports, so it returns here.
          if [ "${ACTION:-}" = "fetch-uniware" ]; then
            python run_drive.py --fetch-only \
              --days "${PAYLOAD_DAYS:-90}" \
              --requested-by "${PAYLOAD_BY:-}"
            exit $?
          fi

          FLAGS=""
          # The scheduled cycle run always rebuilds.
          if [ "$EVENT" = "schedule" ]; then FLAGS="$FLAGS --force"; fi
          if [ "${PAYLOAD_FORCE:-}" = "true" ]; then FLAGS="$FLAGS --force"; fi
          if [ "${INPUT_FORCE:-}" = "true" ]; then FLAGS="$FLAGS --force"; fi
          if [ "${INPUT_NO_EMAIL:-}" = "true" ]; then FLAGS="$FLAGS --no-email"; fi
          python run_drive.py $FLAGS --requested-by "${PAYLOAD_BY:-}"

      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_number }}
          path: |
            reports/output/reconciliation_checks.csv
            reports/output/exceptions.csv
          if-no-files-found: ignore
          retention-days: 14
